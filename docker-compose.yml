services:
  php:
    build:
      context: ./back
      target: base    # stage base uniquement : pas de COPY code ni composer --no-dev
    container_name: sportlink_api
    volumes:
      - ./back:/var/www/html
      # vendor hors du montage Windows → gros gain perf (autoload Symfony)
      - back_vendor:/var/www/html/vendor
      - php_var:/var/www/html/var
      - ./back/docker/php-dev.ini:/usr/local/etc/php/conf.d/zzz-dev.ini
    ports:
      - "8000:80"
    environment:
      APP_ENV: dev
      # "1" en dev pour les vraies erreurs JSON ; "0" = page HTML générique sur les 500
      APP_DEBUG: "1"
    depends_on:
      - db

  db:
    image: mysql:8.0
    container_name: sportlink_db
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: sportlink
      MYSQL_USER: sportlink
      MYSQL_PASSWORD: sportlink
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql

  node:
    image: node:22
    container_name: front
    working_dir: /app
    volumes:
      - ./front:/app
      # node_modules dans le conteneur (évite la sync Windows lente / cassée)
      - front_node_modules:/app/node_modules
    ports:
      - "5173:5173"
    environment:
      CHOKIDAR_USEPOLLING: "true"
      WATCHPACK_POLLING: "true"
    command: sh -c "npm install && npm run dev"
    tty: true

  phpmyadmin:
    image: phpmyadmin
    container_name: phpmyadmin
    ports:
      - "8080:80"
    environment:
      PMA_HOST: db
      PMA_USER: sportlink
      PMA_PASSWORD: sportlink
    depends_on:
      - db

volumes:
  db_data:
  php_var:
  back_vendor:
  front_node_modules: