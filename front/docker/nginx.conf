server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Taille max des requêtes (uploads logo, pièces jointes éventuelles)
    client_max_body_size 10m;

    # Assets Vite — les noms de fichiers sont hachés (cache-busting intégré)
    # → TTL d'un an safe, le navigateur rechargera automatiquement quand le hash change
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Proxy /api/* → conteneur back PHP/Apache (réseau interne Docker)
    # proxy_pass sans chemin en suffixe = URI complète forwarded telle quelle :
    # /api/matchs → http://php/api/matchs (Apache/Symfony reçoit le chemin complet)
    location /api/ {
        proxy_pass            http://php;
        proxy_set_header      Host              $host;
        proxy_set_header      X-Real-IP         $remote_addr;
        proxy_set_header      X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header      X-Forwarded-Proto $scheme;
        proxy_read_timeout    60s;
        proxy_connect_timeout 10s;
    }

    # SPA fallback — toutes les routes Vue (côté client) retombent sur index.html
    # Sans ça, un refresh sur /matchs/42 retournerait un 404 nginx
    location / {
        try_files $uri $uri/ /index.html;
    }
}
