# docker-compose.prod.yml — Production
#
# Point d'entrée unique : nginx (:8090 en local, :80 sur le serveur)
# Sert le front Vue en statique et proxifie /api vers PHP/Apache.
#
# AVANT DE LANCER :
#   1. Créer un fichier .env à la racine du projet avec les secrets (voir bas de fichier)
#   2. Vérifier que back/config/jwt/private.pem et public.pem existent sur l'hôte
#      → En local : déjà générés (gitignorés, jamais dans l'image)
#      → Sur un nouveau serveur : docker compose -f docker-compose.prod.yml run --rm php \
#            php bin/console lexik:jwt:generate-keypair
#   3. docker compose -f docker-compose.prod.yml build
#   4. docker compose -f docker-compose.prod.yml up -d
#   5. docker compose -f docker-compose.prod.yml exec php php bin/console doctrine:migrations:migrate --no-interaction
#      (cache:warmup est automatique — l'entrypoint le lance en prod avant Apache)

services:
  nginx:
    build:
      context: ./front
      target: production
    container_name: sportlink_nginx_prod
    restart: unless-stopped
    ports:
      # Port par défaut : 80 (prod). Surcharger via NGINX_PORT dans le .env racine si le port 80
      # est déjà pris (ex. en local : NGINX_PORT=8090 dans .env → http://localhost:8090).
      - "${NGINX_PORT:-80}:80"
    depends_on:
      - php

  php:
    build:
      context: ./back
      target: prod
    container_name: sportlink_api_prod
    restart: unless-stopped
    volumes:
      # var/ : cache Symfony (warmup) + logs — survit aux redémarrages du conteneur
      - php_var_prod:/var/www/html/var
      # Clés JWT montées depuis l'hôte en lecture seule.
      # Les clés ne sont PAS dans l'image (exclues par .dockerignore).
      # → En local : back/config/jwt/ contient déjà private.pem et public.pem
      # → Sur le serveur : générer une fois via lexik:jwt:generate-keypair (voir ci-dessus)
      - ./back/config/jwt:/var/www/html/config/jwt:ro
    # Aucun port exposé publiquement — seul nginx peut atteindre ce service
    environment:
      APP_ENV: prod
      APP_DEBUG: "0"
      # Secrets fournis depuis le .env racine (local) ou les variables d'environnement de l'hôte
      APP_SECRET: ${APP_SECRET}
      DATABASE_URL: ${DATABASE_URL}
      JWT_PASSPHRASE: ${JWT_PASSPHRASE}
      CORS_ALLOW_ORIGIN: ${CORS_ALLOW_ORIGIN:-'^http://localhost:8090$'}
    depends_on:
      - db

  db:
    image: mysql:8.0
    container_name: sportlink_db_prod
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE:      ${MYSQL_DATABASE:-sportlink}
      MYSQL_USER:          ${MYSQL_USER:-sportlink}
      MYSQL_PASSWORD:      ${MYSQL_PASSWORD}
    volumes:
      - db_data_prod:/var/lib/mysql
    # Aucun port exposé publiquement

volumes:
  db_data_prod:
  php_var_prod:

# ── Variables requises dans le .env racine (non commité) ──────────────────
# Copier le bloc ci-dessous dans un fichier .env à la racine du projet
# et renseigner chaque valeur :
#
# MYSQL_ROOT_PASSWORD=changeme_root
# MYSQL_PASSWORD=changeme_db
# APP_SECRET=changeme_32_chars_hex         # openssl rand -hex 32
# DATABASE_URL=mysql://sportlink:changeme_db@db:3306/sportlink?serverVersion=8.0&charset=utf8mb4
# JWT_PASSPHRASE=changeme_passphrase
# CORS_ALLOW_ORIGIN=^http://localhost:8090$  # adapter au domaine réel en déploiement
