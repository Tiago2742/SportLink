name: "CD — Déploiement production"

on:
  workflow_run:
    workflows: ["CI — Tests & Qualité"]
    types: [completed]
    branches: [main]

jobs:
  deploy:
    name: "Déploiement sur le serveur"
    runs-on: ubuntu-latest
    # Ne déploie que si la CI qui vient de terminer s'est soldée par un succès.
    # Un run CI rouge (ou annulé) ne déclenche pas le déploiement.
    if: ${{ github.event.workflow_run.conclusion == 'success' }}

    steps:
      - name: Déploiement via SSH (pull → build → up → migrations)
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e
            cd /home/deployer/SportLink
            git pull
            docker compose -f docker-compose.prod.yml build
            docker compose -f docker-compose.prod.yml up -d
            attempts=0
            until docker compose -f docker-compose.prod.yml exec -T php php -r "exit(0);" 2>/dev/null; do
              attempts=$((attempts + 1))
              if [ $attempts -ge 10 ]; then
                echo "Conteneur PHP non disponible après 30 secondes" >&2
                exit 1
              fi
              echo "Attente du conteneur PHP... ($attempts/10)"
              sleep 3
            done
            docker compose -f docker-compose.prod.yml exec -T php php bin/console doctrine:migrations:migrate --no-interaction
