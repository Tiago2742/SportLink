name: Deploy

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]

jobs:
  deploy:
    name: Déploiement production
    runs-on: ubuntu-latest
    # Ne déploie que si la CI qui vient de terminer s'est soldée par un succès.
    # Un run CI rouge (ou annulé) ne déclenche pas le déploiement.
    if: ${{ github.event.workflow_run.conclusion == 'success' }}

    steps:
      - name: Déployer sur le serveur via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          # script_stop: true — si une commande échoue, les suivantes ne s'exécutent pas.
          # Évite de relancer un conteneur avec un code cassé ou des migrations ratées.
          script_stop: true
          script: |
            cd /home/deployer/SportLink
            git pull
            docker compose -f docker-compose.prod.yml build
            docker compose -f docker-compose.prod.yml up -d
            docker compose -f docker-compose.prod.yml exec -T php php bin/console doctrine:migrations:migrate --no-interaction
