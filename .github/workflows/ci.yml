name: "CI — Tests & Qualité"

on:
  push:
  pull_request:

jobs:
  back:
    name: "Back-end — Tests PHPUnit"
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: sportlink_test
          MYSQL_USER: sportlink
          MYSQL_PASSWORD: sportlink
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      DATABASE_URL: "mysql://sportlink:sportlink@127.0.0.1:3306/sportlink?serverVersion=8.0&charset=utf8mb4"

    defaults:
      run:
        working-directory: back

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo, pdo_mysql, intl, zip, ctype, iconv
          coverage: none

      - name: Installer les dépendances (Composer)
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Créer la base de test
        run: php bin/console doctrine:schema:create --env=test

      - name: Charger les données de référence
        run: php bin/console doctrine:fixtures:load --env=test --group=test --no-interaction

      - name: Lancer les tests (PHPUnit)
        run: php vendor/bin/phpunit

  front:
    name: "Front-end — Lint, Types & Build"
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: front

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Installer les dépendances (npm ci)
        run: npm ci

      - name: Lint (oxlint + eslint)
        run: npm run lint:check

      - name: Vérifier les types (vue-tsc)
        run: npm run type-check

      - name: Build de production (vite)
        run: npm run build-only

  e2e:
    name: "E2E — Tests Playwright"
    runs-on: ubuntu-latest
    needs: [back, front]

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: sportlink_test
          MYSQL_USER: sportlink
          MYSQL_PASSWORD: sportlink
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      DATABASE_URL: "mysql://sportlink:sportlink@127.0.0.1:3306/sportlink?serverVersion=8.0&charset=utf8mb4"

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo, pdo_mysql, intl, zip, ctype, iconv
          coverage: none

      - name: Installer les dépendances (Composer)
        working-directory: back
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Générer les clés JWT de test
        working-directory: back
        run: |
          mkdir -p tests/fixtures/jwt
          openssl genrsa -out tests/fixtures/jwt/private.pem 4096
          openssl rsa -in tests/fixtures/jwt/private.pem \
            -pubout -out tests/fixtures/jwt/public.pem

      - name: Créer la base de test
        working-directory: back
        run: php bin/console doctrine:schema:create --env=test

      - name: Charger les données de référence (Sports + Niveaux)
        working-directory: back
        run: php bin/console doctrine:fixtures:load --env=test --group=test --no-interaction

      - name: Charger les comptes de test E2E
        working-directory: back
        run: php bin/console doctrine:fixtures:load --env=test --group=e2e --append --no-interaction

      - name: Démarrer le serveur PHP (arrière-plan)
        working-directory: back
        run: APP_ENV=test php -S 0.0.0.0:8000 -t public/ &

      - name: Attendre que l'API réponde
        run: until curl -s http://localhost:8000/ -o /dev/null; do sleep 1; done

      - name: Diagnostic — API login + profil (à retirer quand 7/7 passent)
        run: |
          echo "=== JWT private key check ==="
          openssl rsa -in back/tests/fixtures/jwt/private.pem \
            -check -noout 2>&1 \
            && echo "OK" || echo "FAIL"
          echo ""
          echo "=== Utilisateurs en base (sportlink_test) ==="
          mysql -u sportlink -psportlink -h 127.0.0.1 sportlink_test \
            -e "SELECT id, email, type FROM utilisateur ORDER BY id DESC LIMIT 5;" 2>/dev/null \
            || echo "(mysql CLI indisponible ou base vide)"
          echo ""
          echo "=== POST /api/login_check (identifiants valides) ==="
          LOGIN=$(curl -s -w "\n---HTTP_CODE:%{http_code}" -X POST http://localhost:8000/api/login_check \
            -H "Content-Type: application/json" \
            -d '{"email":"e2e-joueur@sportlink.test","password":"Test1234!"}')
          echo "$LOGIN"
          TOKEN=$(echo "$LOGIN" | head -1 | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('token',''))" 2>/dev/null || true)
          echo ""
          if [ -n "$TOKEN" ]; then
            echo "=== GET /api/profil (avec le token) ==="
            curl -s -w "\n---HTTP_CODE:%{http_code}" http://localhost:8000/api/profil \
              -H "Authorization: Bearer $TOKEN"
            echo ""
          else
            echo "(pas de token — login a échoué, /profil non testé)"
          fi
          echo ""
          echo "=== POST /api/login_check (mauvais mot de passe) ==="
          curl -s -w "\n---HTTP_CODE:%{http_code}" -X POST http://localhost:8000/api/login_check \
            -H "Content-Type: application/json" \
            -d '{"email":"e2e-joueur@sportlink.test","password":"wrong"}'
          echo ""

      - name: Installer Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Installer les dépendances (npm ci)
        working-directory: front
        run: npm ci

      - name: Build de production (VITE_API_URL baked in)
        working-directory: front
        env:
          VITE_API_URL: http://localhost:8000/api
        run: npm run build-only

      - name: Installer les navigateurs Playwright
        working-directory: front
        run: npx playwright install --with-deps chromium

      - name: Lancer les tests E2E
        working-directory: front
        env:
          BASE_URL: http://localhost:4173
          CI: "true"
        run: npx playwright test

      - name: Publier le rapport Playwright
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: front/playwright-report/
          retention-days: 30
