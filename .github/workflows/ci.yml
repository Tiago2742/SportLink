name: "CI — Tests & Qualité"

on:
  push:
  pull_request:

jobs:
  back:
    name: "Back-end — Tests PHPUnit"
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: sportlink_test
          MYSQL_USER: sportlink
          MYSQL_PASSWORD: sportlink
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      DATABASE_URL: "mysql://sportlink:sportlink@127.0.0.1:3306/sportlink?serverVersion=8.0&charset=utf8mb4"

    defaults:
      run:
        working-directory: back

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo, pdo_mysql, intl, zip, ctype, iconv
          coverage: none

      - name: Installer les dépendances (Composer)
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Créer la base de test
        run: php bin/console doctrine:schema:create --env=test

      - name: Charger les données de référence
        run: php bin/console doctrine:fixtures:load --env=test --group=test --no-interaction

      - name: Lancer les tests (PHPUnit)
        run: php vendor/bin/phpunit

  front:
    name: "Front-end — Lint, Types & Build"
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: front

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Installer les dépendances (npm ci)
        run: npm ci

      - name: Lint (oxlint + eslint)
        run: npm run lint:check

      - name: Vérifier les types (vue-tsc)
        run: npm run type-check

      - name: Build de production (vite)
        run: npm run build-only

  e2e:
    name: "E2E — Tests Playwright"
    runs-on: ubuntu-latest
    needs: [back, front]

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: sportlink_test
          MYSQL_USER: sportlink
          MYSQL_PASSWORD: sportlink
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      DATABASE_URL: "mysql://sportlink:sportlink@127.0.0.1:3306/sportlink?serverVersion=8.0&charset=utf8mb4"
      APP_ENV: test
      APP_SECRET: sportlink_test_app_secret_for_rate_limiter_hashing
      JWT_PASSPHRASE: sportlink_test

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo, pdo_mysql, intl, zip, ctype, iconv
          coverage: none

      - name: Installer les dépendances (Composer)
        working-directory: back
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Générer les clés JWT de test
        working-directory: back
        run: php bin/console lexik:jwt:generate-keypair --env=test --overwrite

      - name: Créer la base de test
        working-directory: back
        run: php bin/console doctrine:schema:create --env=test

      - name: Charger les données de référence (Sports + Niveaux)
        working-directory: back
        run: php bin/console doctrine:fixtures:load --env=test --group=test --no-interaction

      - name: Charger les comptes de test E2E
        working-directory: back
        run: php bin/console doctrine:fixtures:load --env=test --group=e2e --append --no-interaction

      - name: Démarrer le serveur PHP (arrière-plan)
        working-directory: back
        run: |
          APP_ENV=test \
          APP_SECRET=sportlink_test_app_secret_for_rate_limiter_hashing \
          JWT_PASSPHRASE=sportlink_test \
          DATABASE_URL="mysql://sportlink:sportlink@127.0.0.1:3306/sportlink?serverVersion=8.0&charset=utf8mb4" \
          php -S 0.0.0.0:8000 -t public/ &

      - name: Attendre que l'API réponde
        run: until curl -s http://localhost:8000/ -o /dev/null; do sleep 1; done

      - name: Diagnostic — vérifier JWT + API login (bloquant)
        run: |
          echo "=== Variables d'env critiques ==="
          php -r "
            foreach (['APP_ENV','APP_SECRET','JWT_PASSPHRASE'] as \$k) {
              \$v = getenv(\$k);
              echo \$k . ' = ' . (\$v === false ? 'UNSET' : (strlen(\$v) > 0 ? 'SET (' . strlen(\$v) . ' chars)' : 'EMPTY')) . PHP_EOL;
            }
          "
          echo ""
          echo "=== Clé JWT : chargement PHP ==="
          php -r "
            \$key = file_get_contents('back/tests/fixtures/jwt/private.pem');
            echo 'Format : ' . strtok(\$key, '\n') . PHP_EOL;
            \$pass = getenv('JWT_PASSPHRASE') ?: '';
            \$res = openssl_pkey_get_private(\$key, \$pass);
            if (\$res === false) {
              echo 'FAIL — openssl_pkey_get_private retourne false' . PHP_EOL;
              while (\$e = openssl_error_string()) echo \$e . PHP_EOL;
              exit(1);
            }
            echo 'OK — clé chargée' . PHP_EOL;
          "
          echo ""
          echo "=== Utilisateurs en base (sportlink_test) ==="
          mysql -u sportlink -psportlink -h 127.0.0.1 sportlink_test \
            -e "SELECT id, email, type FROM utilisateur ORDER BY id DESC LIMIT 5;" 2>/dev/null \
            || echo "(mysql CLI indisponible)"
          echo ""
          echo "=== POST /api/login_check (identifiants valides) ==="
          HTTP_CODE=$(curl -s -o /tmp/login_resp.json -w "%{http_code}" \
            -X POST http://localhost:8000/api/login_check \
            -H "Content-Type: application/json" \
            -d '{"email":"e2e-joueur@sportlink.test","password":"Test1234!"}')
          echo "HTTP $HTTP_CODE"
          cat /tmp/login_resp.json
          echo ""
          if [ "$HTTP_CODE" != "200" ]; then
            echo "::error::Login API retourne HTTP $HTTP_CODE — les tests e2e vont échouer"
            exit 1
          fi
          TOKEN=$(python3 -c "import json; d=json.load(open('/tmp/login_resp.json')); print(d.get('token',''))" 2>/dev/null || true)
          echo "=== GET /api/profil ==="
          curl -s -w "\n---HTTP %{http_code}" http://localhost:8000/api/profil \
            -H "Authorization: Bearer $TOKEN"
          echo ""

      - name: Installer Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Installer les dépendances (npm ci)
        working-directory: front
        run: npm ci

      - name: Build de production (VITE_API_URL baked in)
        working-directory: front
        env:
          VITE_API_URL: http://localhost:8000/api
        run: npm run build-only

      - name: Installer les navigateurs Playwright
        working-directory: front
        run: npx playwright install --with-deps chromium

      - name: Lancer les tests E2E
        working-directory: front
        env:
          BASE_URL: http://localhost:4173
          CI: "true"
        run: npx playwright test

      - name: Publier le rapport Playwright
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: front/playwright-report/
          retention-days: 30
